name: Core Backend Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Enforce oasis-supabase-core backend authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject shadow migrations and Edge Functions
        run: bash scripts/check-core-backend-authority.sh
